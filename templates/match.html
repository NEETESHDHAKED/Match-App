<!DOCTYPE html>
<html>
<head><title>Match</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10">
<style>body{font-family:Arial;background:#E8F5E9;padding:15px} .card{background:white;padding:20px;border-radius:20px;margin:10px 0;box-shadow:0 5px 15px rgba(0,0,0,0.08);text-align:center} a{color:#2E7D32;font-weight:bold}</style>
</head>
<body>
<a href="/">⬅ BACK</a>
<div class="card">
<h2>{{m.team1}} VS {{m.team2}}</h2>
<h1 style="font-size:40px">{{m.score1}} - {{m.score2}}</h1>
<p>{{m.over}} over | {{m.village}}</p>
<p>🏏 {{m.batsman}} - {{m.batsman_run}} run</p>
<p>🎯 {{m.bowler}}</p>
<h2 style="color:#2E7D32">🏆 {{m.winner}}</h2>
<p>Inam: ₹{{m.price}} | {{m.status}}</p>
<p style="color:red">🔴 LIVE - 10 sec me update</p>
</div>
</body>
</html>
